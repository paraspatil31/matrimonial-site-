<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Bandhan.com</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fc;
      color: #333;
    }

    header {
      background-color: #db2777;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }

    h2 {
      color: #db2777;
      margin-bottom: 20px;
    }

    form {
      display: grid;
      gap: 20px;
    }

    label {
      font-weight: 600;
      margin-bottom: 5px;
      display: block;
      color: #444;
    }

    input, textarea {
      padding: 12px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      resize: vertical;
    }

    button {
      background-color: #db2777;
      color: white;
      padding: 12px 25px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #be185d;
    }

    .success-message {
      display: none;
      background-color: #d1fae5;
      color: #065f46;
      padding: 12px;
      border-radius: 6px;
      margin-top: 20px;
    }

    footer {
      margin-top: 60px;
      padding: 20px;
      background-color: #070204;
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Contact Us</h1>
    <p>We would love to hear from you!</p>
  </header>

  <div class="container">
    <h2>Get in Touch</h2>
    <form id="contactForm">
      <div>
        <label for="name">Your Name</label>
        <input type="text" id="name" required />
      </div>
      <div>
        <label for="email">Your Email</label>
        <input type="email" id="email" required />
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" rows="5" required></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>
    <div class="success-message" id="successMessage">
      ✅ Thank you! We'll get back to you soon.
    </div>
  </div>

  <footer>
    &copy; 2025 Bandhan.com | All rights reserved
  </footer>

  <script>
    const form = document.getElementById('contactForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      //  send the form data to your server
      form.reset();
      successMessage.style.display = 'block';
    });
  </script>

</body>
</html>
